<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
<title id="title">linuxperf | export and explicit sharing</title>
<desc id="desc">Implementation diagram. No default public upload service; TLS is configured separately.</desc>
<rect width="980" height="540" fill="#101923"/>
<g font-family="sans-serif" fill="#f1f6fc">
<text x="40" y="48" font-size="25">linuxperf | export and explicit sharing</text>
<rect x="40" y="78" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="107" font-size="20">1. Local report.json</text>
<text x="60" y="133" font-size="15">Collection does not upload data</text>
<path d="M490 156 v22 m-6 -6 l6 6 6 -6" stroke="#65b5ff" fill="none"/>
<rect x="40" y="178" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="207" font-size="20">2. Local output by default</text>
<text x="60" y="233" font-size="15">export: standalone HTML with escaped JSON; share: data:text/html URL</text>
<path d="M490 256 v22 m-6 -6 l6 6 6 -6" stroke="#65b5ff" fill="none"/>
<rect x="40" y="278" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="307" font-size="20">3. Upload only with --api-url</text>
<text x="60" y="333" font-size="15">gzip JSON: version + metadata + summary; optional bearer token</text>
<path d="M490 356 v22 m-6 -6 l6 6 6 -6" stroke="#65b5ff" fill="none"/>
<rect x="40" y="378" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="407" font-size="20">4. Your serve-reports instance</text>
<text x="60" y="433" font-size="15">POST /api/reports -&gt; SQLite -&gt; GET /r/code; recipients of the link can read it</text>
<text x="40" y="520" font-size="13">Implementation diagram. No default public upload service; TLS is configured separately.</text>
</g></svg>
