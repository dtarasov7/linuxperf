<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
<title id="title">linuxperf | collection flow</title>
<desc id="desc">Implementation diagram, not a screenshot or a performance measurement.</desc>
<rect width="980" height="540" fill="#101923"/>
<g font-family="sans-serif" fill="#f1f6fc">
<text x="40" y="48" font-size="25">linuxperf | collection flow</text>
<rect x="40" y="78" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="107" font-size="20">1. Clean baseline</text>
<text x="60" y="133" font-size="15">procfs / sysfs snapshots before tracing; default interval 1 second</text>
<path d="M490 156 v22 m-6 -6 l6 6 6 -6" stroke="#65b5ff" fill="none"/>
<rect x="40" y="178" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="207" font-size="20">2. Tracing and periodic sampling</text>
<text x="60" y="233" font-size="15">oomkill first; default 2 workers; shared deadline; BCC tools or native tcpretrans</text>
<path d="M490 256 v22 m-6 -6 l6 6 6 -6" stroke="#65b5ff" fill="none"/>
<rect x="40" y="278" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="307" font-size="20">3. Report assembly</text>
<text x="60" y="333" font-size="15">metrics, units, scope, collector status, coverage and observer overhead</text>
<path d="M490 356 v22 m-6 -6 l6 6 6 -6" stroke="#65b5ff" fill="none"/>
<rect x="40" y="378" width="900" height="78" rx="10" fill="#1e3349" stroke="#65b5ff"/>
<text x="60" y="407" font-size="20">4. Local outputs</text>
<text x="60" y="433" font-size="15">report.json; --ai-prompt adds report.prompt.txt and compact JSON</text>
<text x="40" y="520" font-size="13">Implementation diagram, not a screenshot or a performance measurement.</text>
</g></svg>
